[package]
edition      = "2024"
name         = "pami-control"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "pami-control"
path = "./src/main.rs"
test = false

[lib]
test = false

# On-device tests, run with `cargo hil` (see .cargo/config.toml)
[[test]]
name    = "math"
harness = false

[[test]]
name    = "protocol"
harness = false

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "unstable"] }

esp-rtos = { version = "0.4.0", features = ["embassy", "esp32s3"] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }

embassy-executor = { version = "0.10.0", features = [] }
embassy-time     = "0.5.0"
embassy-sync     = "0.8.0"

critical-section = "1.2.0"
static_cell      = "2.1.1"
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }
log         = "0.4"

# embedded-test's macro emits #[cfg(rust_analyzer)]
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rust_analyzer)'] }

[dev-dependencies]
embedded-test = { version = "0.7.1", features = [
  "embassy-010",
  "external-executor",
  "xtensa-semihosting",
  "log",
] }
# probe-rs only shows RTT, not the USB serial esp-println writes to
rtt-target = { version = "0.6.2", features = ["log"] }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
