# Keep compilation settings in this file and user/runtime settings in `esp-config.toml`.
include = ["esp-config.toml"]

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --chip esp32s3"

# On-device tests need probe-rs to read embedded-test results; `cargo run` keeps espflash
[alias]
hil = [
  "test",
  "--config",
  "target.xtensa-esp32s3-none-elf.runner='probe-rs run --chip=esp32s3 --preverify --always-print-stacktrace --no-location'",
]

[env]
# Log filter read at build time, e.g. "info" or "info,pami_control::motor_control=debug"
ESP_LOG = "info"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
]

target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["core"]
